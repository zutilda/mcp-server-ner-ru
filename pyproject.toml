[project]
name = "mcp-server-ner-ru"
version = "0.1.0"
description = "MCP server for Russian NER and PII extraction with reversible redaction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.3.0",
    "natasha>=1.6.0",
    "pydantic>=2",
    # pymorphy2 (via natasha) imports pkg_resources, which setuptools 81+ removed.
    "setuptools<81",
]

[project.scripts]
ner-mcp = "ner_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
